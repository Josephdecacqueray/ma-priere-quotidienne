name = "ma-priere-api"
main = "src/index.js"
compatibility_date = "2025-02-01"
workers_dev = true

[triggers]
# Vérification des rappels Web Push toutes les 5 minutes (lots stricts <= 40 envois/run)
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ma_priere_db"
database_id = "e43b2fc1-5654-470d-b26b-84dc2373cc56"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://josephdecacqueray.github.io"
APP_URL = "https://josephdecacqueray.github.io/ma-priere-quotidienne/"
MAX_USERS = "1000"
MAX_USER_TEXT_BYTES = "2097152"
MAX_PUSH_PER_CRON = "40"
EMAIL_RELAY_PROVIDER = "brevo"
VAPID_SUBJECT = "mailto:noreply@ma-priere-quotidienne.app"
